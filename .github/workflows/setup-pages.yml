name: setup-pages

# GitHub Pages(main 브랜치, 기본 Jekyll 빌드)를 최초 1회 활성화하는 워크플로.
# 활성화 이후에는 실행할 필요가 없다 (이미 활성화된 경우 아무 것도 바꾸지 않음).

on:
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable GitHub Pages (branch build from main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          status=$(curl -s -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}')
          echo "POST /pages -> HTTP $status"
          cat /tmp/pages.json
          if [ "$status" = "201" ]; then
            echo "Pages가 활성화되었습니다. 곧 'pages build and deployment'가 실행됩니다."
          elif [ "$status" = "409" ]; then
            echo "Pages가 이미 활성화되어 있습니다. 변경 없음."
          else
            echo "::error::Pages 활성화 실패 (HTTP $status)"
            exit 1
          fi
