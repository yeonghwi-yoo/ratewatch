name: sync-to-pages

# main 브랜치를 배포 브랜치(gh-pages)로 미러링한다.
# GitHub Pages는 gh-pages 브랜치를 소스로 기본 Jekyll 빌드
# ("pages build and deployment")를 실행해 사이트를 배포한다.
# gh-pages는 main의 사본일 뿐이므로 직접 커밋하지 않는다.

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      urls:
        description: "IndexNow 로 제출할 경로 (쉼표 구분, 예: /deposit/,/saving/). 비우면 최근 커밋에서 자동 추정"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: "pages-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main to gh-pages
        run: git push origin HEAD:gh-pages --force

      # 네이버·빙 등 IndexNow 참여 검색엔진에 바뀐 URL 을 알린다.
      # (구글은 IndexNow 미참여 — 사이트맵으로 자동 발견됨)
      - name: IndexNow 제출
        env:
          INDEXNOW_BEFORE: ${{ github.event.before }}
          INPUT_URLS: ${{ github.event.inputs.urls }}
        run: |
          sleep 90   # Pages 빌드가 끝나 새 내용·키 파일이 서비스될 시간
          if [ -n "$INPUT_URLS" ]; then
            python3 scripts/indexnow.py --urls "$INPUT_URLS"
          else
            python3 scripts/indexnow.py --auto
          fi
