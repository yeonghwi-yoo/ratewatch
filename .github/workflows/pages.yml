name: sync-to-pages

# main 브랜치를 배포 브랜치(gh-pages)로 미러링한다.
# GitHub Pages는 gh-pages 브랜치를 소스로 기본 Jekyll 빌드
# ("pages build and deployment")를 실행해 사이트를 배포한다.
# gh-pages는 main의 사본일 뿐이므로 직접 커밋하지 않는다.

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages-sync"
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Mirror main to gh-pages
        run: git push origin HEAD:gh-pages --force
