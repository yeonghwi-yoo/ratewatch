# 예적금연구소 — 예·적금 금리 비교 사이트
# GitHub Pages 프로젝트 사이트 (https://yeonghwi-yoo.github.io/ratewatch/)

remote_theme: "mmistakes/minimal-mistakes@4.26.2"

locale: "ko-KR"
title: "예적금연구소"
subtitle: "매일 갱신되는 금리 비교"
name: "예적금연구소"
description: "매일 갱신되는 예·적금 금리 비교와 청년·정부지원 금융상품 가이드"
url: "https://yeonghwi-yoo.github.io"
baseurl: "/ratewatch"
repository: "yeonghwi-yoo/ratewatch"

search: true

# GitHub Pages 허용 플러그인만 사용
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate

timezone: Asia/Seoul

include:
  - _pages

exclude:
  - scripts
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

atom_feed:
  hide: false

# 기본 front matter
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: true
      show_date: true
      comments: false
      share: false
      related: true
      toc: true
      toc_sticky: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false

footer:
  links: []
