# 예적금연구소 — 예·적금 금리 비교 사이트
# 커스텀 도메인: https://savinglab.org (루트 CNAME 파일로 연결)

remote_theme: "mmistakes/minimal-mistakes@4.26.2"

locale: "ko-KR"
title: "예적금연구소"
subtitle: "매일 갱신되는 금리 비교"
name: "예적금연구소"
description: "매일 갱신되는 예·적금 금리 비교와 청년·정부지원 금융상품 가이드"
url: "https://savinglab.org"
baseurl: ""
og_image: /assets/images/og-image.png   # 공유(카카오톡·SNS) 미리보기 이미지

search: true

# 구글 애널리틱스 (GA4)
# tracking_id 에 측정 ID(G-XXXXXXXXXX)를 넣으면 다음 배포부터 집계가 시작됩니다.
# 비워 두면 분석 스크립트가 아예 삽입되지 않습니다.
analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-50LHT1Q6MJ"
    anonymize_ip: true

# 피드·메타용 사이트 저자 정보 (익명 운영: 사이트명·문의 메일만)
author:
  name: "예적금연구소"
  email: "contact@savinglab.org"

# GitHub Pages 허용 플러그인만 사용
plugins:
  - jekyll-remote-theme
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-paginate

timezone: Asia/Seoul
date_format: "%Y년 %-m월 %-d일"

# 예약 발행: 미래 날짜 글은 해당 날짜 이후 빌드부터 공개
# (매일 아침 금리 갱신 커밋으로 사이트가 재빌드되므로 자동 발행됨)
future: false

include:
  - _pages

exclude:
  - scripts
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor

atom_feed:
  hide: false

# 기본 front matter
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: false
      read_time: false
      show_date: true
      comments: false
      share: false
      related: true
      toc: true
      toc_sticky: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: false

footer:
  links: []
